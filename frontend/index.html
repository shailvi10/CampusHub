 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub - Management Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">CH</div>
    <div>
      <h2>CampusHub</h2>
      <small>LEARNING MANAGEMENT SYSTEM</small>
    </div>
  </div>
  <div class="user-info">
    <span class="online"></span>
    <span id="roleLabel">Student Portal</span>
    <div class="avatar">S</div>
  </div>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <p class="side-title">WORKSPACE</p>

    <label>Switch Dashboard</label>
    <select id="roleSelect">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>

    <nav id="navigation"></nav>

    <div class="sidebar-footer">
      <h4>CampusHub</h4>
      <p>Learning, Teaching and Managing in one place.</p>
    </div>
  </aside>

  <main class="main">
    <button class="menu-btn" id="menuBtn">☰ Menu</button>
    <div id="pageContent"></div>
    <footer>© 2026 CampusHub Management System</footer>
  </main>

</div>

<!-- Add/Edit Question Modal -->
<div class="modal-bg" id="modal" hidden>
  <div class="modal">
    <div class="modal-heading">
      <h2 id="modalTitle">Add Question</h2>
      <button id="closeModal" class="close-btn">×</button>
    </div>

    <form id="questionForm">
      <input type="hidden" id="questionId">

      <label>Question</label>
      <textarea id="questionText" required placeholder="Enter question"></textarea>

      <label>Subject</label>
      <select id="questionSubject">
        <option>Data Structures</option>
        <option>Database Management</option>
        <option>Operating Systems</option>
        <option>Computer Networks</option>
      </select>

      <label>Question Type</label>
      <select id="questionType">
        <option>MCQ</option>
        <option>Short Answer</option>
        <option>True / False</option>
      </select>

      <div id="mcqFields">
        <label>Option A</label>
        <input id="optionA" value="Array">

        <label>Option B</label>
        <input id="optionB" value="Stack">

        <label>Option C</label>
        <input id="optionC" value="Queue">

        <label>Option D</label>
        <input id="optionD" value="Tree">

        <label>Correct Answer</label>
        <select id="correctAnswer">
          <option>Array</option>
          <option selected>Stack</option>
          <option>Queue</option>
          <option>Tree</option>
        </select>
      </div>

      <button class="btn primary full" type="submit">Save Question</button>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- CampusHub Login and Registration -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>CampusHub</h1>
    <p>Learning Management System</p>

    <form id="loginForm">
      <h2>Welcome Back</h2>

      <label>Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Login</button>

      <p>
        New student?
        <button type="button" id="showRegister">Register</button>
      </p>
    </form>

    <form id="registerForm" hidden>
      <h2>Create Student Account</h2>

      <label>Name</label>
      <input
        type="text"
        id="registerName"
        placeholder="Enter your name"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="registerEmail"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="registerPassword"
        placeholder="At least 8 characters"
        minlength="8"
        required
      >

      <button type="submit">Create Account</button>

      <p>
        Already registered?
        <button type="button" id="showLogin">Login</button>
      </p>
    </form>

    <p id="authMessage"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
